# Replace only the existing HTTPS server block for mypipeline.alexanderm.co.
# Keep the shared HTTP redirect block for MyPipeline and MyGuardMoney in place.
# This file belongs on the VPS host; it is not the container's default.conf.
server {
    listen 443 ssl;
    server_name mypipeline.alexanderm.co;

    ssl_certificate /etc/letsencrypt/live/alexanderm.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexanderm.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # Preserve the full URI, including /v1/, for the container's router.
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
